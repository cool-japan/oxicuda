[package]
name = "oxicuda-metal"
description = "OxiCUDA Metal - GPU compute via Apple Metal API (macOS only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["metal", "gpu", "compute", "macos", "apple"]
categories = ["hardware-support", "science", "mathematics"]

[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true

[dependencies]
oxicuda-backend.workspace = true
thiserror.workspace = true
tracing.workspace = true
num-complex.workspace = true

[dev-dependencies]
criterion.workspace = true

[features]
# When enabled, the device-presence test in `tests/gpu_presence.rs` FAILS
# (rather than silently skipping) if no real Metal device can be acquired.
# Off by default so headless/CI builds without a GPU stay green; turn it on
# explicitly on a machine that is expected to have one:
#   cargo nextest run -p oxicuda-metal --features gpu-tests
gpu-tests = []

[[bench]]
name = "gemm_bench"
harness = false

[[bench]]
name = "reduce_bench"
harness = false

[[bench]]
name = "conv2d_bench"
harness = false

[[bench]]
name = "attention_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
