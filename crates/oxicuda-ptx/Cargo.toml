[package]
name = "oxicuda-ptx"
description = "OxiCUDA PTX - PTX code generation DSL and IR for GPU kernel development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cuda", "ptx", "codegen", "gpu", "kernel"]
categories = ["development-tools", "hardware-support"]

[dependencies]
oxicuda-driver.workspace = true
thiserror.workspace = true

[features]
default = []
# On-device sanity checks that query a real GPU (via oxicuda-driver) and
# compare live hardware attributes against the constants in `arch::SmVersion`.
# Requires a CUDA driver + device at runtime; every such test skips
# gracefully when none is present. See `arch::gpu_tests`.
gpu-tests = ["oxicuda-driver/gpu-tests"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
