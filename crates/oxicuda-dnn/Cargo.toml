[package]
name = "oxicuda-dnn"
description = "OxiCUDA DNN - GPU-accelerated deep learning primitives (cuDNN equivalent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cuda", "dnn", "gpu", "deep-learning", "convolution"]
categories = ["science", "hardware-support"]

[dependencies]
oxicuda-driver.workspace = true
oxicuda-memory.workspace = true
oxicuda-launch.workspace = true
oxicuda-blas.workspace = true
oxicuda-ptx.workspace = true
thiserror.workspace = true
half = { workspace = true, optional = true }

[features]
default = []
f16 = ["dep:half", "oxicuda-blas/f16", "oxicuda-memory/half"]
# On-device GPU validation tests (`src/gpu_tests/`). Enables `f16` so the
# mixed-precision kernels can be exercised with real `half::f16` buffers.
# Requires a CUDA driver + device at runtime; every test skips gracefully when
# none is present.
gpu-tests = ["f16"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "conv2d_resnet50_layer3"
harness = false

[[bench]]
name = "flash_attention_2k_d128"
harness = false

[[bench]]
name = "paged_attention_decode"
harness = false

[[bench]]
name = "moe_mixtral_8x7b"
harness = false

[[bench]]
name = "layernorm_d4096"
harness = false

[[bench]]
name = "rmsnorm_d4096"
harness = false

[[bench]]
name = "batchnorm_inference"
harness = false

[[bench]]
name = "fused_conv_bn_relu"
harness = false

[[bench]]
name = "winograd_vs_implicit_gemm"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
