[package]
name = "oxicuda-webgpu"
description = "OxiCUDA WebGPU - Cross-platform GPU compute via wgpu and WGSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["webgpu", "wgpu", "gpu", "compute", "wgsl"]
categories = ["hardware-support", "science", "mathematics"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# When enabled, the device-presence test in `tests/gpu_presence.rs` FAILS
# (rather than silently skipping) if no real wgpu adapter can be acquired.
# Off by default so headless/CI builds without a GPU stay green; turn it on
# explicitly on a machine that is expected to have one:
#   cargo nextest run -p oxicuda-webgpu --features gpu-tests
gpu-tests = []

[dependencies]
oxicuda-backend.workspace = true
wgpu.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[dev-dependencies]
naga = { workspace = true }
half = { workspace = true }
criterion.workspace = true

[[bench]]
name = "gemm_bench"
harness = false

[[bench]]
name = "reduce_bench"
harness = false

[[bench]]
name = "conv2d_bench"
harness = false

[[bench]]
name = "attention_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
